version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint       # verifica que uses %w, errors.Is y errors.As correctamente
    - misspell        # errores de ortografía en comentarios y strings
    - revive          # estilo idiomático de Go (nombres, comentarios, etc.)
    - unconvert       # conversiones de tipo innecesarias

formatters:
  enable:
    - gofmt
    - goimports       # ordena los imports y agrega o quita los que faltan